[project]
name = "aionepviewer"
version = "0.0.0"
description = "Async Python library for the NEP solar inverter cloud API (nepviewer.net)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["nep", "solar", "inverter", "home-assistant", "async", "aiohttp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Home Automation",
]
dependencies = [
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
cli = [
    "rich>=13.0",
    "termgraph>=0.5.0",
    "platformdirs>=4.0",
    "tomli-w>=1.0",
]

[dependency-groups]
dev = [
    "aionepviewer[cli]",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24",
    "aioresponses>=0.7.9",
    "mypy>=1.10",
    "python-semantic-release>=10.7",
    "ruff>=0.17.3",
]

[project.scripts]
aionepviewer = "aionepviewer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aionepviewer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src/"

[[tool.mypy.overrides]]
module = "aionepviewer.models.*"
warn_return_any = false

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "RUF022",
]

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]
build_command = "uv build"
allow_zero_version = true
