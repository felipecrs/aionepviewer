name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read # for checkout

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"

    env:
      MISE_PYTHON_VERSION: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        env:
          MISE_PYTHON_VERSION: ${{ matrix.python-version }}
        with:
          version: 2026.10.25
          cache_key: '{{ default }}-python${{ matrix.python-version }}'
      - run: mise deps install
      - run: mise run lint
      - run: mise run test

  release:
    runs-on: ubuntu-latest

    needs: test

    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref }}
      cancel-in-progress: false

    permissions:
      contents: write # to publish GitHub release, push commits and tags
      id-token: write # to enable use of OIDC for PyPI trusted publishing

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          version: 2026.10.25
      - run: mise deps install
      - name: Release
        id: release
        run: mise exec -- semantic-release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_COMMIT_AUTHOR: "${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>"

      - name: Publish to GitHub Release
        if: steps.release.outputs.released == 'true'
        run: mise exec -- semantic-release publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
