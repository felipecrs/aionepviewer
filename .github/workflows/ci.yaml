name: ci

on:
  push:
    branches:
      - master
      - next
  pull_request:
    branches:
      - master
      - next

permissions:
  contents: read # for checkout

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        env:
          MISE_PYTHON_VERSION: ${{ matrix.python-version }}
        with:
          version: 2026.10.25
          cache_key: '{{ default }}-python${{ matrix.python-version }}'
      - run: mise run install
      - run: mise run test
      - run: mise run typecheck

  release:
    runs-on: ubuntu-latest

    needs: test

    if: github.event_name == 'push'

    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref }}
      cancel-in-progress: false

    permissions:
      contents: write # to publish GitHub release, push commits and tags
      id-token: write # to enable use of OIDC for PyPI trusted publishing

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Align branch pointer
        run: git reset --hard ${{ github.sha }}

      - uses: jdx/mise-action@v4
        with:
          version: 2026.10.25

      - run: mise run install

      - name: Release
        id: release
        run: mise exec -- semantic-release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Release
        if: steps.release.outputs.released == 'true'
        run: mise exec -- semantic-release publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
