[tools]
python = "3.15.2"
uv = "0.13.7"

[settings]
experimental = true
python.uv_venv_auto = "create|source"

[env]
UV_PYTHON_PREFERENCE = "only-system"

[deps.uv]
auto = true

[tasks.lint]
description = "Lint, format, and type check"
run = "ruff check && ruff format --check && mypy ."

[tasks.fix-lint]
description = "Fix lint and format issues"
run = "ruff check --fix && ruff format"

[tasks.test]
description = "Run tests"
run = "pytest"
